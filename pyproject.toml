[build-system]
requires = ["setuptools>=75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent-core"
version = "0.1.0"
description = "Reusable LangGraph core for code-review agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.24",
    "pydantic>=2.11,<3",
]

[project.scripts]
review-agent = "review_agent_core.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1", "openai>=2,<4", "mcp>=1.30,<2",
]

[tool.setuptools]
packages = ["review_agent_core"]

[tool.setuptools.package-dir]
review_agent_core = "."

[tool.setuptools.package-data]
review_agent_core = ["static/*"]
