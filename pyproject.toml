[build-system]
requires = ["setuptools>=75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent-core"
version = "0.1.0"
description = "Reusable LangGraph core for code-review agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.24",
    "pydantic>=2.11,<3",
]

[project.scripts]
review-agent = "review_agent_core.cli:main"

[tool.setuptools]
packages = ["review_agent_core"]

[tool.setuptools.package-dir]
review_agent_core = "."
